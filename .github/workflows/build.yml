name: Build APK

# 触发：每次 push 到 main、打 tag(v*)，以及向 main 开 PR 时构建
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 打 tag 时需要创建 Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 方便读取 tag 信息

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ---- 仅在 main 分支 push / tag 时签名 release ----
      - name: Decode keystore (release only)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/composedtv-release.jks

      - name: Generate keystore.properties (release only)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=app/composedtv-release.jks
          EOF

      # ---- 自动版本号：从 tag (v1.2.3) 写入 ----
      - name: Derive version from tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
            echo "versionName=$VER" >> "$GITHUB_OUTPUT"
            echo "isRelease=true" >> "$GITHUB_OUTPUT"
          else
            # 非 tag 构建用纯数字三段版本号（补丁段放时间戳），
            # 保证 versionCode 为正数，避免 gradle 报 versionCode=0
            VER="0.0.$(date +%Y%m%d%H%M)"
            echo "versionName=$VER" >> "$GITHUB_OUTPUT"
            echo "isRelease=false" >> "$GITHUB_OUTPUT"
          fi

      # ---- 构建：main/tag → release(含 universal)；PR → 仅 debug ----
      - name: Build Release APK
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.versionName }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Build Debug APK (PR)
        if: github.event_name == 'pull_request'
        run: ./gradlew assembleDebug --no-daemon

      # ---- 上传产物 ----
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks-${{ steps.version.outputs.versionName }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk

      # ---- 打 tag 时自动创建 GitHub Release 并附 APK ----
      - name: Create GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.versionName }}
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
